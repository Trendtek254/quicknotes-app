<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your thoughts, ideas, and tasks instantly.</p>
  </header>

  <main>
    <section>
      <h2>Add a Note</h2>
      <form id="note-form">
        <label for="note-input">Note Text</label>
        <input type="text" id="note-input" placeholder="Enter your note here..." required>
        
        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>

    <section>
      <h2>Your Notes</h2>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search notes...">
      </div>
      <div class="notes-header">
        <p id="note-count">You have no notes yet.</p>
        <button id="clear-all-btn" class="secondary-btn">Clear All</button>
      </div>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. Built with HTML, CSS, and Vanilla JavaScript.</p>
  </footer>
</body>
</html>
